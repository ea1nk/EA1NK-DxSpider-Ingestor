version: "3.9"
services:
  db:
    image: mongo:4.4.18
    container_name: ingestor-mongo
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # El archivo de log no pasará de 10 Megabytes
        max-file: "3"     # Guardará máximo 3 archivos (30MB total) antes de rotar
    ports:
      - "27017:27017"
    volumes:
      - /mnt/wdred/ingester_data:/data/db

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dxspider-ingestor
    restart: unless-stopped
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
    volumes:
      # SQLite database with users and DX cluster sources
      - ./data:/data
    healthcheck:
      # /health returns 503 when the DX cluster has been down longer than HEALTH_GRACE_MS
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "3000:3000"