<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{{STATUS}} - DX Spots Live</title>
    <style>
        :root { --bg: #0f111a; --card: #1a1c25; --text: #e1e1e6; --muted: #888; --border: #343849; --accent: #00ff7f; }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px 20px; min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 18px; }
        .site-footer { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.3px; }
        .site-footer b { color: #c8ccd8; font-weight: 600; }
        .card { background: var(--card); border: 1px solid #262938; border-radius: 12px; padding: 32px 28px; width: min(460px, 100%); text-align: center; }
        .code { font-family: 'Cascadia Code', monospace; font-size: 4rem; font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: 2px; }
        .signal { color: var(--muted); font-family: 'Cascadia Code', monospace; font-size: 0.8rem; margin: 10px 0 18px; letter-spacing: 1px; }
        h1 { font-size: 1.3rem; margin: 0 0 8px; color: #fff; }
        p { color: #aab0c4; font-size: 0.9rem; line-height: 1.5; margin: 0; }
        .path { margin-top: 10px; font-family: 'Cascadia Code', monospace; font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
        .actions { display: flex; gap: 8px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; background: #1f2230; color: #e1e1e6; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { border-color: #4a4f63; }
        .btn.primary { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="card" data-status="{{STATUS}}">
        <div class="code">{{STATUS}}</div>
        <div class="signal">— · · · —&nbsp;&nbsp;NO SIGNAL&nbsp;&nbsp;— · · · —</div>
        <h1 id="err-title">Error</h1>
        <p id="err-text"></p>
        <div class="path" id="err-path"></div>
        <div class="actions">
            <a class="btn primary" href="/" data-i18n="err.home">Ir a los spots</a>
            <button class="btn" type="button" id="err-back" data-i18n="err.back">Volver</button>
        </div>
    </main>
    <footer class="site-footer">Powered by <b>EA1NK - SCQ Devices</b></footer>
    <script src="/i18n.js?v=20261009e"></script>
    <script>
        (function () {
            const status = document.querySelector('main').dataset.status;
            const key = status === '404' || status === '500' ? status : 'other';
            document.getElementById('err-title').textContent = t(`err.${key}.title`);
            document.getElementById('err-text').textContent = t(`err.${key}.text`);
            if (status === '404') document.getElementById('err-path').textContent = location.pathname;
            const back = document.getElementById('err-back');
            if (history.length > 1) back.onclick = () => history.back();
            else back.hidden = true;
        })();
    </script>
</body>
</html>
