<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX Monitor Live</title>
    <style>
        :root {
            --bg: #0f111a;
            --card: #1a1c25;
            --text: #e1e1e6;
            --accent: #00ff7f;
            --rbn: #666;
            --trad: #2196f3;
            --panel-width: 235px;
            --panel-top: 0px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .page-header {
            width: 100%;
            padding: 20px 20px 0;
            position: relative;
            z-index: 220;
            background: var(--bg);
        }

        .content-shell {
            display: block;
            padding: 0 20px 20px;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        /* === PANEL LATERAL === */
        .side-panel {
            display: flex;
            flex-direction: row;
            position: fixed;
            top: var(--panel-top);
            left: 20px;
            height: calc(100vh - var(--panel-top));
            z-index: 180;
        }

        .side-panel-inner {
            width: var(--panel-width);
            background: rgba(26, 28, 37, 0.9);
            border-right: 1px solid #2d2d3d;
            padding: 15px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: width 0.25s ease, padding 0.25s ease, opacity 0.15s ease;
            opacity: 1;
            max-height: calc(100vh - var(--panel-top));
            height: calc(100vh - var(--panel-top));
            box-shadow: 8px 0 24px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(4px);
        }

        .side-panel.collapsed .side-panel-inner {
            width: 0;
            padding: 0;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Pestaña de archivador */
        .side-tab {
            background: var(--card);
            color: var(--accent);
            width: 42px;
            min-height: 170px;
            padding: 12px 6px;
            cursor: pointer;
            border-right: 2px solid var(--accent);
            font-weight: bold;
            font-size: 0.78rem;
            user-select: none;
            border-top: 1px solid #2d2d3d;
            border-bottom: 1px solid #2d2d3d;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }
        .side-tab:hover { background: #1e2030; }

        .side-tab-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .side-tab-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            line-height: 1;
            letter-spacing: 0;
        }

        .side-tab-letter {
            display: block;
        }

        /* === SECCIONES DE FILTROS === */
        .filtro-seccion {
            border-bottom: 1px solid #2d2d3d;
            padding-bottom: 10px;
        }
        .filtro-seccion:last-child { border-bottom: none; }

        .filtro-seccion-titulo {
            font-size: 0.63rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1.5px;
            margin-bottom: 7px;
        }

        /* Fila input + botón indicativo */
        .indicativo-input-row {
            display: flex;
            gap: 5px;
            margin-bottom: 7px;
            align-items: center;
        }
        .indicativo-input-row input {
            flex: 1;
            min-width: 0;
            padding: 5px 8px;
            font-size: 0.82rem;
        }
        .indicativo-input-row .btn-add {
            flex-shrink: 0;
            padding: 5px 10px;
            margin: 0;
            font-size: 1rem;
            line-height: 1;
        }

        /* === CONTENIDO PRINCIPAL === */
        .main-content {
            min-width: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #2d2d3d;
            padding-bottom: 15px;
        }

        #status {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .online  { background: #1b5e20; color: #4caf50; border: 1px solid #4caf50; }
        .offline { background: #b71c1c; color: #f44336; border: 1px solid #f44336; }

        /* === TABLA === */
        select, input {
            background: #2d2d3d;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .table-container {
            overflow-x: auto;
            background: var(--card);
            border-radius: 8px;
            margin-left: 56px;
        }

        .announcements-container {
            margin-top: 14px;
            margin-left: 56px;
            background: var(--card);
            border-radius: 8px;
            border: 1px solid #2d2d3d;
            min-height: 130px;
            padding: 12px;
        }

        .announcements-title {
            margin: 0 0 8px 0;
            font-size: 0.72rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #8b93a7;
        }

        .announcements-list {
            color: #c7ccda;
            font-size: 0.9rem;
            min-height: 80px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; color: #8b93a7; font-size: 0.72rem; letter-spacing: 1.2px; padding: 4px 6px; text-transform: uppercase; border-bottom: 2px solid #0f111a; }
        td { padding: 3px 6px; border-bottom: 1px solid #2d2d3d; font-size: 0.87rem; }

        .freq { font-family: 'Cascadia Code', monospace; font-weight: bold; color: #fff; font-size: 1.05rem; }
        .band { color: #888; font-size: 0.7rem; }
        .callsign { font-size: 1.08rem; font-weight: 800; color: var(--accent); }
        .country { color: #aaa; font-size: 0.78rem; }
        .mode-label, .banda-label, .qsl-label { font-size: 0.82rem !important; padding: 2px 7px !important; min-width: 32px !important; }

        /* === BOTONES DE FILTRO (igual que index.html) === */
        .mode-label {
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
            background: #222;
            font-size: 0.9rem;
            display: inline-block;
            min-width: 40px;
            text-align: center;
            margin: 2px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border 0.2s, opacity 0.2s;
        }
        [class*="mode-"] { color: #fff; border-color: #888; background: #222; }
        .qsl-label.desactivado { opacity: 0.3; }

        .mode-CW   { color: #ffae00; border-color: #ffae00; background: #1a1400; }
        .mode-FT8  { color: #00d4ff; border-color: #00d4ff; background: #00222a; }
        .mode-FT4  { color: #00e6a8; border-color: #00e6a8; background: #00332a; }
        .mode-SSB  { color: #ff00ff; border-color: #ff00ff; background: #1a002a; }
        .mode-RTTY { color: #ffb300; border-color: #ffb300; background: #332600; }
        .mode-PSK  { color: #00ffb3; border-color: #00ffb3; background: #00332a; }
        .mode-DIGI { color: #00ff7f; border-color: #00ff7f; background: #00331a; }

        .banda-label, .qsl-label {
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
            background: #222;
            font-size: 0.9rem;
            display: inline-block;
            min-width: 40px;
            text-align: center;
            margin: 2px;
            border: 2px solid #444;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border 0.2s, opacity 0.2s;
            color: #aaa;
        }
        .banda-label.selected, .qsl-label.selected {
            background: #00ff7f22;
            color: #00ff7f;
            border-color: #00ff7f;
            opacity: 1 !important;
        }

        .flag { width: 35px; height: 24px; object-fit: cover; border-radius: 3px; border: 1px solid #444; }
        .badge { font-size: 0.6rem; padding: 2px 5px; border-radius: 3px; margin-right: 8px; vertical-align: middle; font-weight: bold; }
        .rbn-type  { background: var(--rbn); color: #fff; }
        .trad-type { background: var(--trad); color: #fff; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="page-header">
        <div class="header">
            <h1 style="margin:0; font-size: 1.5rem;">📡 DX SPOTS LIVE</h1>
            <div id="status" class="offline">DISCONNECTED</div>
        </div>
    </div>

    <div class="content-shell">

    <!-- PANEL LATERAL COLAPSABLE -->
    <div class="side-panel collapsed" id="side-panel">
        <div class="side-panel-inner" id="side-panel-inner">

            <div class="filtro-seccion">
                <div class="filtro-seccion-titulo">Bandas</div>
                <div id="panel-bandas"></div>
            </div>

            <div class="filtro-seccion">
                <div class="filtro-seccion-titulo">Modos</div>
                <div id="panel-modos"></div>
            </div>

            <div class="filtro-seccion">
                <div class="filtro-seccion-titulo">Origen</div>
                <div id="panel-origen"></div>
            </div>

            <div class="filtro-seccion">
                <div class="filtro-seccion-titulo">QSL</div>
                <div id="panel-qsl"></div>
            </div>

            <div class="filtro-seccion">
                <div class="filtro-seccion-titulo">Indicativo</div>
                <div class="indicativo-input-row">
                    <input type="text" id="input-indicativo" placeholder="Indicativo...">
                    <button class="banda-label btn-add" id="btn-add-indicativo">+</button>
                </div>
                <div id="panel-indicativos"></div>
            </div>

        </div>
        <!-- Pestaña de archivador -->
        <div class="side-tab" id="side-tab">
            <svg class="side-tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64L4.86 10.7c-.04.31-.06.63-.06.95s.02.64.06.95l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54c.04.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.58-.22 1.13-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z" fill="currentColor"/>
            </svg>
            <span class="side-tab-label" aria-label="Filtros">
                <span class="side-tab-letter">F</span>
                <span class="side-tab-letter">I</span>
                <span class="side-tab-letter">L</span>
                <span class="side-tab-letter">T</span>
                <span class="side-tab-letter">R</span>
                <span class="side-tab-letter">O</span>
                <span class="side-tab-letter">S</span>
            </span>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 2vw;">Freq / Banda</th>
                        <th style="width: 6vw;">DX Station / Country</th>
                        <th style="width: 2vw;">Modo</th>
                        <th style="width: 4vw;">LoTW / eQSL</th>
                        <th style="width: 6vw;">Spotter</th>
                        <th style="width: 15vw;">Info / SNR</th>
                    </tr>
                </thead>
                <tbody id="spot-list"></tbody>
            </table>
        </div>

        <div class="announcements-container" id="announcements-container">
            <h2 class="announcements-title">Announcements</h2>
            <div class="announcements-list" id="announcements-list"></div>
        </div>
    </div>
    </div>

    <script>
    // === Lógica completa de filtros y spots (adaptada de monitor.js) ===

    const FILTERS_KEY = 'dxmonitor-filtros';
    const BANDAS = ['160m','80m','60m','40m','30m','20m','17m','15m','12m','10m','6m'];
    const MODOS = ['CW', 'SSB', 'FT8', 'FT4', 'RTTY', 'PSK', 'DIGI'];
    const TIPOS = ['RBN', 'TRAD'];
    const QSL_FILTERS = ['LoTW', 'eQSL'];

    let filtros = {
        bandas: [...BANDAS],
        modos: [...MODOS],
        tipos: [...TIPOS],
        qsl: [],
        indicativos: []
    };

    function guardarFiltros() {
        localStorage.setItem(FILTERS_KEY, JSON.stringify(filtros));
    }

    function cargarFiltros() {
        const data = localStorage.getItem(FILTERS_KEY);
        if (data) {
            try {
                const loaded = JSON.parse(data);
                const loadedQsl = Array.isArray(loaded.qsl)
                    ? loaded.qsl.filter(q => QSL_FILTERS.includes(q))
                    : [];
                filtros = {
                    bandas: loaded.bandas || [...BANDAS],
                    modos: loaded.modos || [...MODOS],
                    tipos: loaded.tipos || [...TIPOS],
                    qsl: loadedQsl,
                    indicativos: loaded.indicativos || []
                };
            } catch {}
        }
    }

    function isTruthyQsl(value) {
        if (typeof value === 'string') return value.toLowerCase() === 'true';
        return !!value;
    }

    function getNormalizedActiveQslFilters() {
        const raw = Array.isArray(filtros.qsl) ? filtros.qsl : [];
        return [...new Set(raw.filter(q => QSL_FILTERS.includes(q)))];
    }

    function getSpotQslFlags(spot) {
        return {
            hasLotw: isTruthyQsl(spot?.cty?.spotted?.lotw),
            hasEqsl: isTruthyQsl(spot?.cty?.spotted?.eqsl),
        };
    }

    // --- Buffer y renderizado ---
    const MAX_SPOTS = 15;
    const SPOT_BUFFER = 200;
    let spotBuffer = [];

    function filtrarSpots() {
        return spotBuffer.filter(spot => {
            const bandMatch = filtros.bandas.length === 0 || filtros.bandas.includes(spot.band);
            let modeMatch = true;
            if (filtros.modos.length > 0) {
                const DIGI_MODES = ['FT8','FT4','RTTY','PSK','WSPR','JT65','JT9','OLIVIA','FSK','MFSK','PSK31','PSK63','ROS','PACKET','HELL','DOMINO','THOR','THROB','MT63','SSTV','FAX','FSK441','MSK144','FT8CALL','JS8','Q65','QRA64','T10','DIGI'];
                if (filtros.modos.includes('DIGI')) {
                    modeMatch = DIGI_MODES.includes(spot.mode) ? true : filtros.modos.includes(spot.mode);
                } else {
                    modeMatch = filtros.modos.includes(spot.mode);
                }
            }
            let tipoMatch = true;
            if (filtros.tipos && filtros.tipos.length > 0 && filtros.tipos.length < 2) {
                tipoMatch = filtros.tipos.includes('RBN') ? !!spot.rbn : !spot.rbn;
            }
            let qslMatch = true;
            const activeQsl = getNormalizedActiveQslFilters();
            if (activeQsl.length > 0) {
                const { hasLotw, hasEqsl } = getSpotQslFlags(spot);
                qslMatch = activeQsl.length === 1
                    ? (activeQsl[0] === 'LoTW' ? hasLotw : hasEqsl)
                    : (hasLotw || hasEqsl);
            }
            const callMatch = filtros.indicativos.length === 0 ||
                filtros.indicativos.some(call => spot.spotted.toLowerCase().includes(call.toLowerCase()));
            return bandMatch && modeMatch && tipoMatch && qslMatch && callMatch;
        });
    }

    function renderSpots() {
        const spotList = document.getElementById('spot-list');
        spotList.innerHTML = '';
        filtrarSpots().slice(0, MAX_SPOTS).forEach(spot => {
            spotList.appendChild(crearSpotRow(spot));
        });
    }

    function crearSpotRow(spot) {
        const row = document.createElement('tr');
        row.dataset.band = spot.band;
        row.dataset.mode = spot.mode;
        row.dataset.type = spot.rbn ? 'rbn' : 'trad';
        row.dataset.call = spot.spotted.toLowerCase();
        const adif = spot.cty?.spotted?.data?.ADIF;
        const flagImg = adif
            ? `<img src="/flags/${adif}.svg" class="flag" onerror="this.style.display='none'">`
            : '<div style="width:35px"></div>';
        const { hasLotw, hasEqsl } = getSpotQslFlags(spot);
        row.innerHTML = `
            <td><span class="freq">${spot.freq.toFixed(1)}</span><br><span class="band">${spot.band}</span></td>
            <td><div style="display:flex; align-items:center; gap:15px">${flagImg}<div>
                <span class="badge ${spot.rbn ? 'rbn-type' : 'trad-type'}">${spot.rbn ? 'RBN' : 'TRAD'}</span>
                <span class="callsign" title="Doble clic para abrir en QRZ" style="cursor:pointer;">${spot.spotted}</span>
                <br><span class="country">${spot.cty?.spotted?.data?.Country || 'Unknown'}</span>
            </div></div></td>
            <td><span class="mode-label mode-${spot.mode}">${spot.mode}</span></td>
            <td>
                <span class="qsl-label ${hasLotw ? 'selected' : 'desactivado'}">LoTW</span>
                <span class="qsl-label ${hasEqsl ? 'selected' : 'desactivado'}">eQSL</span>
            </td>
            <td><strong>${spot.spotter}</strong><br><small style="color:#666">${spot.cty?.spotter?.data?.Country || ''}</small></td>
            <td style="color:#ccc; font-size:0.9rem">${spot.snr ? '<b style="color:#00ff7f">' + spot.snr + ' dB</b>' : '<i>' + spot.comment + '</i>'}</td>
        `;
        const callsignEl = row.querySelector('.callsign');
        if (callsignEl) {
            callsignEl.addEventListener('dblclick', () => {
                const targetCall = encodeURIComponent((spot.spotted || '').toUpperCase());
                if (!targetCall) return;
                window.open(`https://www.qrz.com/db/${targetCall}`, '_blank', 'noopener,noreferrer');
            });
        }
        return row;
    }

    // --- WebSocket ---
    function conectarWS() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        const status = document.getElementById('status');
        let socket = new WebSocket(wsUrl);
        socket.onopen  = () => { status.innerText = 'ONLINE';  status.className = 'online'; };
        socket.onclose = () => { status.innerText = 'OFFLINE'; status.className = 'offline'; setTimeout(conectarWS, 2000); };
        socket.onmessage = (event) => {
            const spot = JSON.parse(event.data);
            if (!spot.spotted) return;
            spotBuffer.unshift(spot);
            if (spotBuffer.length > SPOT_BUFFER) spotBuffer.pop();
            renderSpots();
        };
    }

    // --- Helpers de botones (mismo estilo que index.html) ---
    function crearBotonFiltro(texto, activo, onClick, claseExtra = '', tipo = 'modo') {
        const btn = document.createElement('button');
        if (tipo === 'banda') {
            btn.className = 'banda-label' + (activo ? ' selected' : ' desactivado');
            btn.style.opacity = activo ? '1' : '0.3';
        } else {
            btn.className = `mode-label ${claseExtra}`;
            btn.style.opacity = activo ? '1' : '0.3';
        }
        btn.textContent = texto;
        btn.onclick = onClick;
        return btn;
    }

    // --- Renderizado del panel lateral (5 secciones) ---
    function renderPanelFiltros() {
        // Bandas
        const panelBandas = document.getElementById('panel-bandas');
        panelBandas.innerHTML = '';
        BANDAS.forEach(banda => {
            panelBandas.appendChild(crearBotonFiltro(banda, filtros.bandas.includes(banda), () => {
                if (filtros.bandas.includes(banda)) filtros.bandas = filtros.bandas.filter(b => b !== banda);
                else filtros.bandas.push(banda);
                guardarFiltros(); renderPanelFiltros(); renderSpots();
            }, '', 'banda'));
        });

        // Modos
        const panelModos = document.getElementById('panel-modos');
        panelModos.innerHTML = '';
        MODOS.forEach(modo => {
            panelModos.appendChild(crearBotonFiltro(modo, filtros.modos.includes(modo), () => {
                if (filtros.modos.includes(modo)) filtros.modos = filtros.modos.filter(m => m !== modo);
                else filtros.modos.push(modo);
                guardarFiltros(); renderPanelFiltros(); renderSpots();
            }, `mode-${modo}`));
        });

        // Origen
        const panelOrigen = document.getElementById('panel-origen');
        panelOrigen.innerHTML = '';
        TIPOS.forEach(tipo => {
            panelOrigen.appendChild(crearBotonFiltro(tipo, filtros.tipos.includes(tipo), () => {
                if (filtros.tipos.includes(tipo)) filtros.tipos = filtros.tipos.filter(t => t !== tipo);
                else filtros.tipos.push(tipo);
                guardarFiltros(); renderPanelFiltros(); renderSpots();
            }, '', 'banda'));
        });

        // QSL
        const panelQsl = document.getElementById('panel-qsl');
        panelQsl.innerHTML = '';
        QSL_FILTERS.forEach(qsl => {
            panelQsl.appendChild(crearBotonFiltro(qsl, filtros.qsl.includes(qsl), () => {
                if (filtros.qsl.includes(qsl)) filtros.qsl = filtros.qsl.filter(q => q !== qsl);
                else filtros.qsl.push(qsl);
                guardarFiltros(); renderPanelFiltros(); renderSpots();
            }, '', 'banda'));
        });

        // Indicativos monitorizados
        const panelIndicativos = document.getElementById('panel-indicativos');
        panelIndicativos.innerHTML = '';
        filtros.indicativos.forEach(call => {
            panelIndicativos.appendChild(crearBotonFiltro(call, true, () => {
                filtros.indicativos = filtros.indicativos.filter(c => c !== call);
                guardarFiltros(); renderPanelFiltros(); renderSpots();
            }, 'mode-CW'));
        });
    }

    // --- Setup del panel lateral y del input de indicativos ---
    function setupPanel() {
        const sidePanel = document.getElementById('side-panel');
        const sideTab = document.getElementById('side-tab');
        const contentShell = document.querySelector('.content-shell');

        const actualizarPosicionPanel = () => {
            const top = Math.max(0, Math.round(contentShell.getBoundingClientRect().top));
            document.documentElement.style.setProperty('--panel-top', `${top}px`);
        };

        actualizarPosicionPanel();
        window.addEventListener('resize', actualizarPosicionPanel);
        window.addEventListener('scroll', actualizarPosicionPanel, { passive: true });

        // Toggle colapso por la pestaña
        sideTab.addEventListener('click', (event) => {
            event.stopPropagation();
            sidePanel.classList.toggle('collapsed');
        });

        sidePanel.addEventListener('click', (event) => {
            event.stopPropagation();
        });

        // Cerrar al hacer clic fuera del panel
        document.addEventListener('click', (event) => {
            if (sidePanel.classList.contains('collapsed')) return;
            if (!sidePanel.contains(event.target)) {
                sidePanel.classList.add('collapsed');
            }
        });

        // Input de indicativo: botón y Enter
        const input  = document.getElementById('input-indicativo');
        const addBtn = document.getElementById('btn-add-indicativo');
        const añadir = () => {
            const val = input.value.trim().toUpperCase();
            if (val && !filtros.indicativos.includes(val)) {
                filtros.indicativos.push(val);
                guardarFiltros(); renderPanelFiltros(); renderSpots();
            }
            input.value = '';
        };
        addBtn.addEventListener('click', añadir);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') añadir(); });
    }

    // --- Inicialización ---
    document.addEventListener('DOMContentLoaded', () => {
        cargarFiltros();
        renderPanelFiltros();
        setupPanel();
        conectarWS();
        renderSpots();
    });
    </script>
</body>
</html>
