<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX Monitor Live - NKPI4</title>
    <style>
        :root {
            --bg: #0f111a;
            --card: #1a1c25;
            --text: #e1e1e6;
            --accent: #00ff7f;
            --rbn: #666;
            --trad: #2196f3;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #2d2d3d;
            padding-bottom: 15px;
        }

        #status { 
            padding: 6px 15px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: bold; 
            letter-spacing: 1px;
        }
        .online { background: #1b5e20; color: #4caf50; border: 1px solid #4caf50; }
        .offline { background: #b71c1c; color: #f44336; border: 1px solid #f44336; }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card);
            padding: 15px;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        select, input {
            background: #2d2d3d;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .table-container {
            overflow-x: auto;
            background: var(--card);
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; color: #888; font-size: 0.65rem; padding: 8px 7px; text-transform: uppercase; border-bottom: 2px solid #0f111a; }
        td { padding: 6px 7px; border-bottom: 1px solid #2d2d3d; font-size: 0.92rem; }

        .freq { font-family: 'Cascadia Code', monospace; font-weight: bold; color: #fff; font-size: 1.05rem; }
        .band { color: #888; font-size: 0.7rem; }
        .callsign { font-size: 1.08rem; font-weight: 800; color: var(--accent); }
        .country { color: #aaa; font-size: 0.78rem; }
        .mode-label, .banda-label { font-size: 0.82rem !important; padding: 2px 7px !important; min-width: 32px !important; }
        
        .mode-label {
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
            background: #222;
            font-size: 0.9rem;
            display: inline-block;
            min-width: 40px;
            text-align: center;
            margin: 0 2px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border 0.2s, opacity 0.2s;
        }
        .mode-CW { color: #ffae00; border-color: #ffae00; background: #1a1400; }
        .mode-FT8 { color: #00d4ff; border-color: #00d4ff; background: #00222a; }
        .mode-FT4 { color: #00e6a8; border-color: #00e6a8; background: #00332a; }
        .mode-SSB { color: #ff00ff; border-color: #ff00ff; background: #1a002a; }
        .mode-RTTY { color: #ffb300; border-color: #ffb300; background: #332600; }
        .mode-PSK { color: #00ffb3; border-color: #00ffb3; background: #00332a; }
        .mode-DIGI { color: #00ff7f; border-color: #00ff7f; background: #00331a; }
        /* Estilo por defecto para modos no definidos, solo si no hay una clase específica */
        .mode-label[class*="mode-"]:not(.mode-CW):not(.mode-FT8):not(.mode-FT4):not(.mode-SSB):not(.mode-RTTY):not(.mode-PSK):not(.mode-DIGI) {
            color: #fff;
            border-color: #888;
            background: #222;
        }
        .banda-label {
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
            background: #222;
            font-size: 0.9rem;
            display: inline-block;
            min-width: 40px;
            text-align: center;
            margin: 0 2px;
            border: 2px solid #444;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border 0.2s, opacity 0.2s;
        }
        .banda-label.selected {
            background: #00ff7f22;
            color: #00ff7f;
            border-color: #00ff7f;
            opacity: 1 !important;
        }
        .filtros-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 30px;
        }
        
        .flag { width: 35px; height: 24px; object-fit: cover; border-radius: 3px; border: 1px solid #444; }
        
        .badge { font-size: 0.6rem; padding: 2px 5px; border-radius: 3px; margin-right: 8px; vertical-align: middle; font-weight: bold; }
        .rbn-type { background: var(--rbn); color: #fff; }
        .trad-type { background: var(--trad); color: #fff; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; font-size: 1.5rem;">📡 DX SPOTS LIVE</h1>
        <div id="status" class="offline">DISCONNECTED</div>
    </div>

    <div class="controls" style="flex-direction:column; gap:0;">
        <div style="display:flex; justify-content:flex-end; align-items:center;">
                        <button id="filtros-toggle" style="margin-bottom:10px; background:var(--card); color:var(--accent); border:none; font-size:1rem; padding:10px 18px 10px 10px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:8px;">
                                <span id="filtros-toggle-svg" style="display:flex; align-items:center;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5a1 1 0 0 1 1-1h12a1 1 0 0 1 .8 1.6l-4.2 5.6V16a1 1 0 0 1-1.447.894l-2-1A1 1 0 0 1 8 15v-3.8L3.2 6.6A1 1 0 0 1 3 5z" stroke="#00ff7f" stroke-width="1.5" fill="none"/></svg>
                                </span>
                                <span id="filtros-toggle-text">Mostrar filtros</span>
                                <span id="filtros-toggle-icon">▼</span>
                        </button>
        </div>
        <div id="filtros-panel" style="padding:10px 0;"></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Freq / Banda</th>
                    <th>DX Station / Country</th>
                    <th>Modo</th>
                    <th>Spotter</th>
                    <th>Info / SNR</th>
                </tr>
            </thead>
            <tbody id="spot-list"></tbody>
        </table>
    </div>

   <script src="monitor.js"></script>
</body>
</html>

            <option value="trad">Solo Tradicional</option>
        </select>
        
        <input type="text" id="filter-call" placeholder="Buscar indicativo...">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Freq / Banda</th>
                    <th>DX Station / Country</th>
                    <th>Modo</th>
                    <th>Spotter</th>
                    <th>Info / SNR</th>
                </tr>
            </thead>
            <tbody id="spot-list"></tbody>
        </table>
    </div>

   <script>

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;

    const spotList = document.getElementById('spot-list');
    const status = document.getElementById('status');

    // Filtros
    const fBand = document.getElementById('filter-band');
    const fMode = document.getElementById('filter-mode');
    const fType = document.getElementById('filter-type');
    const fCall = document.getElementById('filter-call');

    let socket;
    const MAX_SPOTS = 50; // Límite de spots en pantalla
    const SPOT_BUFFER = 500; // Buffer global de spots
    let spotBuffer = [];

    function connect() {
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            status.innerText = 'ONLINE';
            status.className = 'online';
        };

        socket.onclose = () => {
            status.innerText = 'OFFLINE';
            status.className = 'offline';
            setTimeout(connect, 2000);
        };

        socket.onmessage = (event) => {
            const spot = JSON.parse(event.data);
            if (!spot.spotted) return;

            // Añadir al buffer global (al principio)
            spotBuffer.unshift(spot);
            if (spotBuffer.length > SPOT_BUFFER) spotBuffer.pop();

            renderSpots();
        };
    }

    function renderSpots() {
        // Limpiar la tabla
        spotList.innerHTML = '';
        // Filtrar el buffer según los filtros activos
        const filtered = spotBuffer.filter(spot => {
            const bandMatch = fBand.value === 'all' || spot.band === fBand.value;
            const modeMatch = fMode.value === 'all' || spot.mode === fMode.value;
            const typeMatch = fType.value === 'all' || (spot.rbn ? 'rbn' : 'trad') === fType.value;
            const callMatch = fCall.value === '' || spot.spotted.toLowerCase().includes(fCall.value.toLowerCase());
            return bandMatch && modeMatch && typeMatch && callMatch;
        });
        // Tomar los 50 más recientes
        filtered.slice(0, MAX_SPOTS).forEach(spot => {
            renderSpotRow(spot);
        });
    }

    function renderSpotRow(spot) {
        const row = document.createElement('tr');
        row.dataset.band = spot.band;
        row.dataset.mode = spot.mode;
        row.dataset.type = spot.rbn ? 'rbn' : 'trad';
        row.dataset.call = spot.spotted.toLowerCase();

        const adif = spot.cty?.spotted?.data?.ADIF;
        const flagImg = adif ? `<img src="/flags/${adif}.svg" class="flag" onerror="this.style.display='none'">` : '<div style="width:35px"></div>';

        row.innerHTML = `
            <td>
                <span class="freq">${spot.freq.toFixed(1)}</span><br>
                <span class="band">${spot.band}</span>
            </td>
            <td>
                <div style="display:flex; align-items:center; gap:15px">
                    ${flagImg}
                    <div>
                        <span class="badge ${spot.rbn ? 'rbn-type':'trad-type'}">${spot.rbn ? 'RBN':'TRAD'}</span>
                        <span class="callsign">${spot.spotted}</span><br>
                        <span class="country">${spot.cty?.spotted?.data?.Country || 'Unknown'}</span>
                    </div>
                </div>
            </td>
            <td><span class="mode-label mode-${spot.mode}">${spot.mode}</span></td>
            <td>
                <strong>${spot.spotter}</strong><br>
                <small style="color:#666">${spot.cty?.spotter?.data?.Country || ''}</small>
            </td>
            <td style="color:#ccc; font-size:0.9rem">
                ${spot.snr ? '<b style="color:#00ff7f">'+spot.snr+' dB</b>' : '<i>'+spot.comment+'</i>'}
            </td>
        `;
        spotList.appendChild(row);
    }

    // Escuchar cambios en los filtros para re-renderizar la tabla
    [fBand, fMode, fType, fCall].forEach(el => {
        el.addEventListener('input', () => {
            renderSpots();
        });
    });

    connect();
</script>
</body>
</html>
